name: cpp-cmake-mingw-prebuilt-release-actions-workflow
on:
  push:
    paths-ignore:
      - 'README.md'
    # # Sequence of patterns matched against refs/tags
    # tags:
    #   - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
permissions:
    contents: write
    
jobs:
  build:
    # strategy:
    #   matrix:
    #     compiler:
    #     - {
    #         name: "x86_64-8.1.0-release-posix-seh-rt_v6-rev0",
    #         url: "https://github.com/dirkarnez/cpp-tools/raw/main/x86_64-8.1.0-release-posix-seh-rt_v6-rev0.7z"
    #       }
    #     # - {
    #     #     name: "winlibs-x86_64-posix-seh-gcc-11.2.0-mingw-w64-9.0.0-r1",
    #     #     url: "https://github.com/brechtsanders/winlibs_mingw/releases/download/11.2.0-12.0.1-9.0.0-r1/winlibs-x86_64-posix-seh-gcc-11.2.0-mingw-w64-9.0.0-r1.zip"
    #     #   }
    #     # - {
    #     #     name: "msvc2019"
    #     #   }

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - shell: cmd
        run: |
          .\setup.cmd
          
      - shell: cmd
        run: |
          .\local-build.cmd
          
      - shell: cmd
        run: |
          dir /S

      - shell: cmd
        run: |
          curl https://github.com/dirkarnez/exec-timeout/releases/download/v1.0.0/exec-timeout-v1.0.0-windows-latest.zip -L -O &&^
          7z x exec-timeout-v1.0.0-windows-latest.zip &&^
          exec-timeout.exe 1800 "%CD%\cmake-build\posix_demo.exe"
          
      - name: Archive Release
        uses: thedoctor0/zip-release@master
        with:
          type: 'zip'
          directory: "cmake-build"
          filename: "${{ github.event.repository.name }}-${{ github.ref_name }}-13.1.0-202407240918mingw1310.zip"
        
      - name: Release prebuilt
        uses: ncipollo/release-action@v1
        with:
          artifacts: "cmake-build/${{ github.event.repository.name }}-${{ github.ref_name }}-13.1.0-202407240918mingw1310.zip"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
